name: Core tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      # The afterms tree imports optional ML stacks at collection time.
      # Portable afterms coverage lives in optional_stack.yml, where those
      # dependencies are installed. Keep this job genuinely NumPy-only.
      - name: Run NumPy-only core tests
        run: python -m pytest -q --ignore=tests/afterms
